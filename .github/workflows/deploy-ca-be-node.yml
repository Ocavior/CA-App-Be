# Tests, then deploys ca-be-node to ca-app.ocvrs.in. Runs on the self-hosted
# runner on the Mac that serves the API. See ca-be-node/README.md, "Deployment".
name: Deploy ca-be-node

on:
  push:
    branches:
      - main
    paths:
      - 'ca-be-node/**'
      - 'test/**'
      - '.github/workflows/deploy-ca-be-node.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ca-app
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATH_PREFIX: /opt/homebrew/bin:/opt/homebrew/opt/postgresql@17/bin

jobs:
  test-and-deploy:
    runs-on: [self-hosted, macOS, ca-app]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Add Homebrew to PATH
        run: echo "$PATH_PREFIX" | tr ':' '\n' >> "$GITHUB_PATH"

      - name: Test
        run: ca-be-node/ops/ci-test.sh

      - name: Deploy
        run: ca-be-node/ops/deploy.sh
