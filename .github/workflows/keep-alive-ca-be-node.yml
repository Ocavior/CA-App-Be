# Pings the Render free instance so it doesn't sleep after 15 idle minutes.
# Runs every 10 minutes because GitHub often starts scheduled runs late.
# Override the target with the repository variable KEEP_ALIVE_URL.
name: Keep ca-be-node awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.KEEP_ALIVE_URL || 'https://ca-app.ocvrs.in/api/v1/ca/health' }}
        # A cold start can take about a minute, so allow retries.
        run: curl -fsS -m 90 --retry 3 --retry-delay 10 -o /dev/null -w "%{http_code} in %{time_total}s\n" "$URL"
